org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ── Target version ────────────────────────────────────────────────────────────
# Change these two lines to recompile for a different Minecraft / Forge version.
# The Java source is compatible with Forge 40.x+ (MC 1.18.2+).
#
# Common combinations:
#   mc_version=1.18.2   forge_version=40.3.0
#   mc_version=1.19.2   forge_version=43.4.0
#   mc_version=1.20.1   forge_version=47.4.13
#
# NeoForge (1.20.1+): change the dependency in build.gradle to
#   "net.neoforged:neoforge:<version>" and update the package imports in
#   DataExporter.java / ExportMod.java from net.minecraftforge.* to
#   net.neoforged.* (and mods.toml to neoforge.mods.toml format).
mc_version=1.20.1
forge_version=47.4.13
